name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  security:
    name: Security (gitleaks + bandit + pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 전체 커밋 히스토리를 봐야 과거에 심긴 시크릿을 잡는다

      # 차단 O — 시크릿이 1건이라도 나오면 CI 실패.
      # 2026-08-20 기준 히스토리 전체 0건이며, .gitleaks.toml 이 오탐 규칙을 담고 있다.
      - name: gitleaks — 시크릿 스캔 (전체 히스토리)
        run: |
          set -e
          VER=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --log-level warn

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 정적 분석 도구 설치
        run: pip install --upgrade pip bandit pip-audit

      # 참고용 전체 리포트 — 실패시켜도 노이즈만 되므로 출력만 한다
      - name: bandit — 전체 리포트 (참고)
        continue-on-error: true
        run: bandit -r backend -x backend/tests -f screen

      # 차단 O — 심각도 HIGH & 확신도 HIGH 만. 도입 시점 노이즈를 줄이려는 의도적 문턱이며,
      # MEDIUM 이하는 위 참고 리포트에서 눈으로 본다.
      - name: bandit — HIGH/HIGH 만 차단
        run: bandit -r backend -x backend/tests -lll -iii

      # 차단 X — 전이 의존성에 새 CVE 가 뜨면 무관한 배포까지 막힌다.
      # 추적은 Dependabot 이 맡고, 여기서는 로그로만 남긴다.
      - name: pip-audit — 의존성 CVE (보고 전용)
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt

  backend:
    name: Backend (syntax + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-dev.txt'

      - name: Install dependencies (test only — gevent-free)
        run: |
          pip install --upgrade pip
          # 운영 deps 전체는 무거우니 테스트에 필요한 최소만 설치
          # (main.py는 import 시 yfinance/bs4/pandas 등을 lazy 또는 try-import)
          pip install pytest pytest-cov fastapi pydantic requests beautifulsoup4 lxml
          # yfinance/pandas는 실제로 import되므로 필요
          pip install yfinance pandas

      - name: Syntax check
        run: python -m py_compile main.py

      - name: Run pytest
        run: pytest -v

  frontend:
    name: Frontend (build + lazy chunks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify bundle structure
        run: |
          set -e
          # 메인 chunk가 너무 크지 않은지 (gzip 50KB 미만 목표)
          MAIN=$(ls -la ../backend/static/assets/index-*.js | head -1)
          echo "Main bundle: $MAIN"
          # vendor 분리 확인
          ls -la ../backend/static/assets/vendor-*.js | head -10
          # 탭 lazy chunks 확인
          ls -la ../backend/static/assets/*Tab*.js | head -10
          # sw.js precache가 새 번들 참조하는지
          grep -oE "index-[A-Za-z0-9_-]+\.js" ../backend/static/sw.js | head -1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: backend/static/
          retention-days: 7
