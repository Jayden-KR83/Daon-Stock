# gitleaks 설정 — 시크릿 스캔
#
# 2026-08-20 전체 히스토리 최초 스캔: 탐지 5건 전부 오탐, 실제 시크릿 0건.
# 오탐 정체는 아래 allowlist 주석 참조.
#
# 로컬 실행:
#   gitleaks git . --config .gitleaks.toml --redact
# CI(.github/workflows/ci.yml security 잡)에서 매 push 마다 자동 실행되며,
# 1건이라도 나오면 빌드가 실패한다.

[extend]
useDefault = true

# ── 오탐 1 · Anthropic 모델 ID ────────────────────────────────────────────────
# `_call_claude(api_key, "claude-haiku-4-5-20251001", ...)` 처럼 인자 이름
# `api_key` 바로 뒤에 오는 모델 ID 문자열이 generic-api-key 룰에 걸린다.
# 실제 Anthropic 키는 `sk-ant-` 로 시작하므로 이 패턴과 겹치지 않는다.
[[allowlists]]
description = "Anthropic 모델 ID (claude-*) 는 시크릿이 아님"
regexes = ['''^claude-[a-z0-9.\-]+$''']

# ── 스캔 제외 경로 ────────────────────────────────────────────────────────────
# lock 파일·번들 산출물은 고엔트로피 해시 덩어리라 오탐만 나온다.
[[allowlists]]
description = "빌드 산출물·lock 파일"
paths = [
  '''package-lock\.json$''',
  '''backend/static/assets/.*''',
  '''backend/static/sw\.js$''',
]
